name: Electron Windows builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test diagnosis, compatibility and price provenance
        run: npm test
      - name: Package minified portable Windows app
        run: npm run package
      - name: Create checksum
        shell: pwsh
        run: |
          Get-ChildItem release/PCInsight-*-win-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PCInsight-Windows
          path: |
            release/PCInsight-*-win-x64.exe
            release/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: PCInsight-Windows
          path: release
      - name: Attach Windows executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "PC Insight $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem release/PCInsight-*-win-x64.exe | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
